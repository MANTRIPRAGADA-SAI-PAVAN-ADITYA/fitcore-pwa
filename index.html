<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="FitCore — Premium offline fitness app for cutting and strengthening. 105kg → 90kg.">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FitCore">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.json">
  <title>FitCore — Cut & Strengthen</title>
  <style>
    /* ============================================================
       DESIGN TOKENS
    ============================================================ */
    :root {
      --bg:           #0a0a0f;
      --card:         #16161e;
      --card2:        #12121a;
      --border:       #1e1e2e;
      --border2:      #252538;
      --accent:       #6366f1;
      --accent-l:     #818cf8;
      --accent-dim:   rgba(99,102,241,.15);
      --accent-dim2:  rgba(99,102,241,.08);
      --accent2:      #f97316;
      --accent2-dim:  rgba(249,115,22,.15);
      --success:      #22c55e;
      --success-dim:  rgba(34,197,94,.15);
      --warning:      #eab308;
      --warning-dim:  rgba(234,179,8,.15);
      --danger:       #ef4444;
      --danger-dim:   rgba(239,68,68,.15);
      --text:         #f1f5f9;
      --text2:        #cbd5e1;
      --muted:        #64748b;
      --muted2:       #475569;
      --chest:        #ef4444;
      --back:         #3b82f6;
      --shoulders:    #a855f7;
      --biceps:       #f97316;
      --triceps:      #eab308;
      --legs:         #22c55e;
      --r:            12px;
      --r-btn:        20px;
      --r-chip:       8px;
      --nav-h:        68px;
      --safe-t:       env(safe-area-inset-top, 0px);
      --safe-b:       env(safe-area-inset-bottom, 0px);
      --safe-l:       env(safe-area-inset-left, 0px);
      --safe-r:       env(safe-area-inset-right, 0px);
    }

    /* ============================================================
       RESET & BASE
    ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      font-size: 14px;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button {
      cursor: pointer;
      font-family: inherit;
      font-size: inherit;
      border: none;
      background: none;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    svg { display: block; }
    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }

    /* ============================================================
       APP SHELL
    ============================================================ */
    #app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100dvh;
      position: relative;
      overflow: hidden;
      background: var(--bg);
    }

    /* ============================================================
       SCREENS
    ============================================================ */
    .screen {
      display: none;
      flex-direction: column;
      min-height: calc(100dvh - var(--nav-h) - var(--safe-b));
      padding-bottom: 24px;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
    .screen.active {
      display: flex;
      animation: screenIn .22s ease-out;
    }

    @keyframes screenIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ============================================================
       OVERLAYS (full-screen panels)
    ============================================================ */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: var(--bg);
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
    .overlay.open {
      display: flex;
      animation: overlayIn .25s ease-out;
    }

    @keyframes overlayIn {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .overlay-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      padding-top: calc(16px + var(--safe-t));
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: rgba(10,10,15,.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 10;
    }

    /* ============================================================
       BOTTOM NAVIGATION
    ============================================================ */
    #bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      height: calc(var(--nav-h) + var(--safe-b));
      padding-bottom: var(--safe-b);
      background: rgba(18,18,26,.96);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      padding-top: 8px;
      z-index: 100;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 6px 2px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .03em;
      text-transform: uppercase;
      transition: color .2s ease;
      min-height: 48px;
      border-radius: 8px;
    }
    .nav-item:active { opacity: .7; }
    .nav-item.active { color: var(--accent); }
    .nav-item svg { transition: transform .2s ease; }
    .nav-item.active svg { transform: scale(1.1); }

    /* ============================================================
       MODALS (bottom sheets)
    ============================================================ */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 300;
      background: rgba(0,0,0,.65);
      align-items: flex-end;
      justify-content: center;
    }
    .modal-backdrop.open {
      display: flex;
      animation: backdropIn .2s ease-out;
    }
    @keyframes backdropIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .modal-sheet {
      background: var(--card);
      border-radius: 20px 20px 0 0;
      padding: 8px 20px 24px;
      padding-bottom: calc(24px + var(--safe-b));
      width: 100%;
      max-width: 480px;
      animation: sheetUp .25s cubic-bezier(.32,0,.67,0);
    }
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    .modal-handle {
      width: 36px;
      height: 4px;
      background: var(--border2);
      border-radius: 2px;
      margin: 0 auto 20px;
    }

    /* ============================================================
       REST TIMER OVERLAY
    ============================================================ */
    #rest-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 250;
      background: rgba(0,0,0,.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    #rest-overlay.open { display: flex; animation: backdropIn .2s ease-out; }

    /* ============================================================
       TYPOGRAPHY SCALE
    ============================================================ */
    .t-hero   { font-size: 22px; font-weight: 700; letter-spacing: -.025em; line-height: 1.2; }
    .t-h1     { font-size: 18px; font-weight: 700; letter-spacing: -.02em;  line-height: 1.3; }
    .t-h2     { font-size: 15px; font-weight: 600; letter-spacing: -.01em;  line-height: 1.4; }
    .t-h3     { font-size: 13px; font-weight: 600; line-height: 1.4; }
    .t-body   { font-size: 14px; font-weight: 400; line-height: 1.6; }
    .t-sm     { font-size: 12px; line-height: 1.5; }
    .t-xs     { font-size: 11px; line-height: 1.4; }
    .t-label  { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
    .t-num    { font-size: 26px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
    .t-muted  { color: var(--muted); }
    .t-accent { color: var(--accent); }
    .t-text2  { color: var(--text2); }

    /* ============================================================
       LAYOUT HELPERS
    ============================================================ */
    .flex          { display: flex; }
    .flex-col      { display: flex; flex-direction: column; }
    .items-center  { align-items: center; }
    .items-start   { align-items: flex-start; }
    .justify-center { justify-content: center; }
    .justify-between { justify-content: space-between; }
    .flex-1        { flex: 1; }
    .shrink-0      { flex-shrink: 0; }
    .w-full        { width: 100%; }
    .gap-1         { gap: 4px; }
    .gap-2         { gap: 8px; }
    .gap-3         { gap: 12px; }
    .gap-4         { gap: 16px; }
    .gap-5         { gap: 20px; }
    .px-5          { padding-left: 20px; padding-right: 20px; }
    .py-4          { padding-top: 16px; padding-bottom: 16px; }
    .p-4           { padding: 16px; }
    .p-5           { padding: 20px; }
    .mt-2          { margin-top: 8px; }
    .mt-3          { margin-top: 12px; }
    .mt-4          { margin-top: 16px; }
    .mt-5          { margin-top: 20px; }
    .mb-3          { margin-bottom: 12px; }
    .mb-4          { margin-bottom: 16px; }
    .hidden        { display: none !important; }
    .rel           { position: relative; }
    .abs           { position: absolute; }
    .overflow-hidden { overflow: hidden; }

    /* ============================================================
       CARDS
    ============================================================ */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      overflow: hidden;
    }
    .card-body { padding: 16px 20px; }
    .card-hover { transition: border-color .2s, background .2s; }
    .card-hover:active { background: var(--card2); border-color: var(--border2); }

    /* ============================================================
       BUTTONS
    ============================================================ */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 24px;
      border-radius: var(--r-btn);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .01em;
      min-height: 48px;
      transition: opacity .15s, transform .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { opacity: .82; transform: scale(.98); }
    .btn-full   { width: 100%; }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 16px rgba(99,102,241,.3);
    }
    .btn-secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-ghost {
      background: transparent;
      color: var(--text2);
      border: 1px solid var(--border);
    }
    .btn-danger {
      background: var(--danger-dim);
      color: var(--danger);
      border: 1px solid rgba(239,68,68,.25);
    }
    .btn-success {
      background: var(--success-dim);
      color: var(--success);
      border: 1px solid rgba(34,197,94,.25);
    }
    .btn-sm {
      padding: 9px 18px;
      font-size: 12px;
      min-height: 36px;
      border-radius: 12px;
    }
    .btn-icon {
      width: 44px; height: 44px;
      padding: 0;
      border-radius: 12px;
      flex-shrink: 0;
    }

    /* ============================================================
       CHIPS / FILTER PILLS
    ============================================================ */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 14px;
      border-radius: var(--r-chip);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .02em;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      cursor: pointer;
      transition: all .15s;
      min-height: 36px;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .chip:active { opacity: .75; }
    .chip.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent-l);
    }
    .chip-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    /* ============================================================
       BADGES
    ============================================================ */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    .badge-chest     { background: var(--danger-dim);   color: var(--chest);     }
    .badge-back      { background: rgba(59,130,246,.15); color: var(--back);      }
    .badge-shoulders { background: rgba(168,85,247,.15); color: var(--shoulders); }
    .badge-biceps    { background: var(--accent2-dim);   color: var(--biceps);    }
    .badge-triceps   { background: var(--warning-dim);   color: var(--triceps);   }
    .badge-legs      { background: var(--success-dim);   color: var(--legs);      }

    /* ============================================================
       SECTION HEADERS
    ============================================================ */
    .screen-header {
      padding: 20px 20px 0;
    }

    .section-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }
    .section-link {
      font-size: 12px;
      color: var(--accent);
      font-weight: 600;
    }

    /* ============================================================
       HOME SCREEN
    ============================================================ */
    .home-hero {
      padding: 20px 20px 16px;
      background: linear-gradient(160deg, rgba(99,102,241,.1) 0%, transparent 55%);
    }

    .today-card {
      margin: 0 20px;
      background: linear-gradient(135deg, rgba(99,102,241,.12), rgba(99,102,241,.04));
      border: 1px solid rgba(99,102,241,.22);
      border-radius: var(--r);
      padding: 20px;
    }
    .today-card.done {
      background: linear-gradient(135deg, rgba(34,197,94,.08), transparent);
      border-color: rgba(34,197,94,.2);
    }
    .today-card.rest-day {
      background: var(--card);
      border-color: var(--border);
    }
    .today-meta-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .today-meta-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--muted);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 0 20px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 16px;
      cursor: pointer;
      transition: border-color .2s;
    }
    .stat-card:active { border-color: var(--accent); }

    .streak-card {
      margin: 0 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .week-dots {
      display: flex;
      gap: 0;
      justify-content: space-between;
    }
    .week-dot-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex: 1;
    }
    .week-dot {
      width: 26px; height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card2);
      border: 2px solid transparent;
      transition: all .2s;
    }
    .week-dot.is-today  { border-color: var(--accent); background: var(--accent-dim); }
    .week-dot.is-done   { background: var(--accent); border-color: var(--accent); }
    .week-dot.is-rest   { opacity: .4; }

    .quote-card {
      margin: 0 20px;
      padding: 16px 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      border-left: 3px solid var(--accent);
    }

    /* ============================================================
       SCHEDULE SCREEN
    ============================================================ */
    .day-tabs {
      display: flex;
      padding: 0 20px;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .day-tabs::-webkit-scrollbar { display: none; }

    .day-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      flex-shrink: 0;
      min-width: 44px;
      transition: all .15s;
      color: var(--muted);
      position: relative;
      -webkit-tap-highlight-color: transparent;
    }
    .day-tab.active { background: var(--accent-dim); color: var(--accent); }
    .day-tab-num { font-size: 16px; font-weight: 700; }
    .day-tab-name { font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
    .day-tab-dot {
      position: absolute;
      bottom: 4px;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--accent);
    }

    .workout-block {
      margin: 0 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      overflow: hidden;
    }
    .workout-block-header {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }
    .workout-block-icon {
      width: 34px; height: 34px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .exercise-row {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .exercise-row:last-child { border-bottom: none; }
    .exercise-row:active { background: rgba(255,255,255,.03); }
    .ex-mini-svg {
      width: 42px; height: 42px;
      border-radius: 9px;
      background: var(--card2);
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ex-mini-svg svg { width: 42px; height: 34px; }

    .warmup-row, .cooldown-row {
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .warmup-row:last-child, .cooldown-row:last-child { border-bottom: none; }

    /* ============================================================
       EXERCISE LIBRARY SCREEN
    ============================================================ */
    .search-wrap {
      margin: 0 20px;
      position: relative;
    }
    .search-input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r-btn);
      color: var(--text);
      padding: 12px 16px 12px 44px;
      font-size: 14px;
      outline: none;
      transition: border-color .2s;
      caret-color: var(--accent);
    }
    .search-input::placeholder { color: var(--muted); }
    .search-input:focus { border-color: var(--accent); }
    .search-icon {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .chips-scroll {
      display: flex;
      gap: 8px;
      padding: 0 20px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .chips-scroll::-webkit-scrollbar { display: none; }

    .exercise-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 0 20px;
    }
    .ex-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      overflow: hidden;
      cursor: pointer;
      transition: border-color .2s, transform .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .ex-card:active { transform: scale(.97); border-color: var(--border2); }
    .ex-card-svg {
      width: 100%;
      aspect-ratio: 7/5;
      background: var(--card2);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ex-card-svg svg { width: 100%; height: 100%; }
    .ex-card-body { padding: 10px 12px 12px; }
    .ex-card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 7px;
    }
    .fav-btn {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--card2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .fav-btn.active { background: var(--danger-dim); border-color: rgba(239,68,68,.3); }
    .difficulty-dots { display: flex; gap: 3px; }
    .diff-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--border2);
    }
    .diff-dot.lit { background: var(--accent2); }

    /* ============================================================
       EXERCISE DETAIL OVERLAY
    ============================================================ */
    .detail-svg-hero {
      width: 100%;
      aspect-ratio: 16/10;
      background: var(--card2);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .detail-svg-hero svg { width: 80%; height: 80%; }

    .tab-bar {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .tab-btn {
      flex: 1;
      padding: 13px 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      transition: all .2s;
      text-align: center;
      letter-spacing: .02em;
      -webkit-tap-highlight-color: transparent;
    }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    .tab-panel { display: none; padding: 16px 20px; }
    .tab-panel.active { display: block; }

    .instr-item {
      display: flex;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
    }
    .instr-item:last-child { border-bottom: none; }
    .instr-num {
      width: 24px; height: 24px;
      border-radius: 50%;

      color: var(--accent-l);

    .spec-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 0 20px;
    }
    .spec-box {
      background: var(--card2);
      border: 1px solid var(--border);

      padding: 14px 12px;

    /* ============================================================
       ACTIVE WORKOUT OVERLAY
    ============================================================ */
    .workout-progress-bar {
      height: 3px;
      background: var(--border);
    }
    .workout-progress-fill {
      height: 100%;
      background: var(--accent);
      transition: width .4s ease;
    }

    .set-table { width: 100%; border-collapse: collapse; }
    .set-table th {
      font-size: 11px; color: var(--muted); font-weight: 600;
      letter-spacing: .05em; text-transform: uppercase;
      padding: 8px 12px; text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .set-table td {
      padding: 11px 12px;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
    }
    .set-table tr:last-child td { border-bottom: none; }
    .set-done td { opacity: .55; }

    .num-input-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex: 1;
    }
    .num-input {
      width: 100%;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      padding: 14px 8px;
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      outline: none;
      transition: border-color .2s;
      caret-color: var(--accent);
      -webkit-appearance: none;
    }
    .num-input:focus { border-color: var(--accent); }

    /* ============================================================
       PROGRESS SCREEN
    ============================================================ */
    .chart-wrap {
      margin: 0 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 18px 16px;
    }

    .heatmap {
      display: grid;
      grid-template-columns: repeat(13, 1fr);
      gap: 4px;
    }
    .heatmap-row { display: contents; }
    .h-cell {
      aspect-ratio: 1;
      border-radius: 3px;
      background: var(--card2);
    }
    .h-cell.done     { background: var(--accent); }
    .h-cell.partial  { background: rgba(99,102,241,.35); }
    .h-cell.rest-d   { background: var(--border); }

    .pr-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .pr-item:last-child { border-bottom: none; }

    .achievement-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .ach-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 14px 10px;
      text-align: center;
      transition: border-color .2s;
    }
    .ach-card.unlocked { border-color: rgba(99,102,241,.35); background: var(--accent-dim2); }
    .ach-card.locked   { opacity: .4; }
    .ach-icon { font-size: 26px; margin-bottom: 6px; }

    /* ============================================================
       EMPTY STATES
    ============================================================ */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 32px;
      text-align: center;
      gap: 10px;
    }

    /* ============================================================
       DIVIDERS & SPACING
    ============================================================ */
    .divider { height: 1px; background: var(--border); }
    .screen-gap { height: 16px; }
    .section-gap { height: 12px; }

    /* ============================================================
       SCROLLBARS
    ============================================================ */
    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    /* ============================================================
       FOCUS / ACCESSIBILITY
    ============================================================ */
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* ============================================================
       REDUCED MOTION
    ============================================================ */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    /* ============================================================
       LANDSCAPE / TABLET
    ============================================================ */
    @media (min-width: 480px) {
      #app { box-shadow: 0 0 60px rgba(0,0,0,.6); }
    }
    @media (orientation: landscape) and (max-height: 500px) {
      #bottom-nav { height: calc(52px + var(--safe-b)); }
      .screen { min-height: calc(100dvh - 52px - var(--safe-b)); }
    }

    /* Schedule */

    /* ── Profile screen ────────────────────────────────── */
    .profile-hero { padding:56px 20px 16px; display:flex; align-items:center; gap:16px; }
    .profile-avatar { width:64px; height:64px; border-radius:50%; background:var(--accent-dim);
      border:2px solid var(--accent)44; display:flex; align-items:center; justify-content:center;
      font-size:28px; flex-shrink:0; }
    .profile-tabs { display:flex; border-bottom:1px solid var(--border); margin:0 20px; }
    .profile-tab { flex:1; padding:10px; text-align:center; font-size:13px; font-weight:600;
      color:var(--muted); border-bottom:2px solid transparent; cursor:pointer;
      background:none; border-top:none; border-left:none; border-right:none;
      transition:all .2s; }
    .profile-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
    .profile-section { padding:16px 20px; display:flex; flex-direction:column; gap:16px; }
    .form-field { display:flex; flex-direction:column; gap:6px; }
    .form-label { font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
    .form-input { background:var(--card); border:1px solid var(--border); border-radius:var(--r);
      color:var(--text); font-size:15px; padding:12px 14px; width:100%;
      box-sizing:border-box; transition:border-color .2s; font-family:inherit; }
    .form-input:focus { outline:none; border-color:var(--accent); }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .measurement-log { display:flex; flex-direction:column; gap:8px; }
    .meas-row { display:flex; align-items:center; justify-content:space-between;
      padding:10px 12px; background:var(--card); border-radius:var(--r); border:1px solid var(--border); }
    .meas-label { font-size:13px; font-weight:600; color:var(--text2); }
    .meas-input-wrap { display:flex; align-items:center; gap:6px; }
    .meas-input { width:64px; background:var(--card2); border:1px solid var(--border2);
      border-radius:8px; color:var(--text); font-size:14px; padding:6px 8px;
      text-align:center; -moz-appearance:textfield; font-family:inherit; }
    .meas-input::-webkit-outer-spin-button,
    .meas-input::-webkit-inner-spin-button { -webkit-appearance:none; }
    .meas-unit { font-size:11px; color:var(--muted); }
    .meas-history-row { display:flex; align-items:center; justify-content:space-between;
      padding:8px 0; border-bottom:1px solid var(--border)66; font-size:13px; }
    .meas-history-row:last-child { border-bottom:none; }
    .meas-sparkline { display:flex; align-items:flex-end; gap:2px; height:24px; }
    .meas-bar { width:6px; background:var(--accent)66; border-radius:2px; min-height:3px; }
    .bmi-card { padding:16px; display:flex; align-items:center; gap:16px; }
    .bmi-ring  { flex-shrink:0; }
    .bmi-meta  { display:flex; flex-direction:column; gap:4px; }
    .settings-group { display:flex; flex-direction:column; gap:12px; }
    .settings-label { font-size:11px; font-weight:700; color:var(--muted); letter-spacing:.06em;
      text-transform:uppercase; padding:4px 0; border-bottom:1px solid var(--border); margin-bottom:4px; }

    /* ── Filter sheet ─────────────────────────────────── */
    .filter-sheet { position:fixed; inset:0; z-index:300; pointer-events:none; }
    .filter-sheet.open { pointer-events:all; }
    .filter-sheet-overlay { position:absolute; inset:0; background:rgba(0,0,0,0); transition:background .3s; }
    .filter-sheet.open .filter-sheet-overlay { background:rgba(0,0,0,.6); }
    .filter-sheet-body { position:absolute; bottom:0; left:0; right:0; background:var(--bg2);
      border-radius:20px 20px 0 0; padding:0 20px 32px; max-height:82vh; overflow-y:auto;
      transform:translateY(100%); transition:transform .35s cubic-bezier(.4,0,.2,1); }
    .filter-sheet.open .filter-sheet-body { transform:translateY(0); }
    .flt-handle { width:40px; height:4px; background:var(--border2); border-radius:2px; margin:12px auto 18px; }
    .flt-hdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .flt-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:20px; }
    .flt-chip { padding:11px 6px; border-radius:10px; border:1.5px solid var(--border); background:var(--card);
      color:var(--text2); font-size:12px; font-weight:600; text-align:center; cursor:pointer;
      transition:all .15s; line-height:1.2; }
    .flt-chip.on { border-color:var(--accent); background:var(--accent)22; color:var(--accent); }
    .filter-btn { display:flex; align-items:center; gap:6px; }
    .filter-btn .flt-count { background:var(--accent); color:#fff; border-radius:9px;
      font-size:11px; font-weight:700; padding:1px 6px; }

    /* ── Workout summary sheet ────────────────────────── */
    .wk-summary { position:fixed; inset:0; background:rgba(0,0,0,.8); display:flex;
      align-items:flex-end; z-index:500; opacity:0; pointer-events:none; transition:opacity .3s; }
    .wk-summary.open { opacity:1; pointer-events:all; }
    .wk-sum-sheet { background:var(--bg2); border-radius:24px 24px 0 0; width:100%;
      max-height:92vh; overflow-y:auto; padding:0 20px 44px; }
    .wk-sum-handle { width:40px; height:4px; background:var(--border2); border-radius:2px; margin:12px auto 20px; }
    .wk-sum-hero { text-align:center; padding:8px 0 20px; }
    .wk-sum-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:0 0 16px; }
    .wk-sum-stat { background:var(--card); border:1px solid var(--border); border-radius:var(--r);
      padding:14px; text-align:center; }
    .wk-mus-row { display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--border)44; }
    .wk-mus-row:last-child { border-bottom:none; }

    /* ── Schedule today indicator ─────────────────────── */
    .day-tab.today-tab .day-name { color:var(--accent); font-weight:700; }
    .day-today-pip { width:5px; height:5px; border-radius:50%; background:var(--accent); margin-top:1px; }
    .day-tab.today-tab { position:relative; }

    /* ── Heatmap compact ──────────────────────────────── */
    .heatmap-wrap { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
    .heat-cell { aspect-ratio:1; border-radius:4px; background:var(--border); }
    .heat-cell.done { background:var(--accent); }
    .heat-cell.rest { background:var(--border)88; opacity:.5; }
    .heat-month-row { display:flex; justify-content:space-between; margin-bottom:4px; }

    /* ── Body card (muscle-highlight thumbnail) ──────── */
    .ex-card-svg { height:110px !important; aspect-ratio:unset !important; padding:4px 0; }
    .ex-card-svg svg { width:auto !important; height:100px; }
    .body-card-svg text { font-family:system-ui,sans-serif; }
    .detail-hero-body { display:flex; justify-content:center; padding:16px 0 8px;
      background:var(--card2); border-bottom:1px solid var(--border); }
    .bc-pulse { animation:bcPulse 2s ease-in-out infinite; }
    @keyframes bcPulse { 0%,100%{opacity:1} 50%{opacity:.55} }

    /* ── Progress dashboard ──────────────────────────── */
    .kpi-strip { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
    .kpi-card  { background:var(--card); border:1px solid var(--border); border-radius:var(--r);
      padding:14px 12px; text-align:center; }
    .kpi-num   { font-size:28px; font-weight:700; letter-spacing:-.04em; line-height:1; }
    .kpi-label { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-top:4px; }
    .kpi-sub   { font-size:11px; color:var(--muted); margin-top:2px; }

    /* ── Weekly weight bar chart ─────────────────────── */
    .wbc-wrap { display:flex; align-items:flex-end; gap:6px; height:80px; margin-top:8px; }
    .wbc-col  { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; }
    .wbc-bar  { width:100%; border-radius:3px 3px 0 0; min-height:3px; background:var(--accent)55; transition:height .3s; }
    .wbc-bar.cur { background:var(--accent); }
    .wbc-lbl  { font-size:9px; color:var(--muted); }
    .wbc-val  { font-size:8px; color:var(--text2); }

    /* ── Month calendar ──────────────────────────────── */
    .month-cal  { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
    .cal-hdrs   { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-bottom:4px; }
    .cal-hdr    { text-align:center; font-size:10px; color:var(--muted); font-weight:600; }
    .cal-cell   { aspect-ratio:1; border-radius:5px; display:flex; align-items:center;
      justify-content:center; font-size:8.5px; font-weight:700; background:var(--card2);
      color:var(--muted); }
    .cal-cell.done  { color:#fff; }
    .cal-cell.today-cell { outline:2px solid var(--accent); outline-offset:1px; }
    .cal-cell.future { opacity:.3; }
    .cal-cell.empty  { background:transparent; }

    /* ── Body heat volume ────────────────────────────── */
    .body-heat-row  { display:flex; align-items:flex-start; gap:16px; }
    .heat-legend    { display:flex; flex-direction:column; gap:4px; padding-top:8px; flex:1; }
    .heat-leg-item  { display:flex; align-items:center; gap:7px; font-size:11px; }
    .heat-leg-dot   { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
    .heat-leg-name  { color:var(--text2); text-transform:capitalize; flex:1; }
    .heat-leg-sets  { color:var(--muted); font-size:10px; }

    /* ── PR sparklines ───────────────────────────────── */
    .pr-spark-list { display:flex; flex-direction:column; gap:6px; }
    .pr-spark-row  { display:flex; align-items:center; gap:10px; padding:10px 12px;
      background:var(--card2); border-radius:var(--r); border:1px solid var(--border)44; cursor:pointer; }
    .pr-spark-info { flex:1; min-width:0; }
    .pr-spark-name { font-size:13px; font-weight:600; color:var(--text); white-space:nowrap;
      overflow:hidden; text-overflow:ellipsis; }
    .pr-spark-meta { font-size:11px; color:var(--muted); margin-top:1px; }
    .pr-spark-chart { flex-shrink:0; }

    /* ── Exercise detail — history tab ───────────────── */
    .hist-empty { padding:24px 0; text-align:center; color:var(--muted); font-size:13px; }
    .hist-session { background:var(--card2); border-radius:var(--r); padding:10px 12px;
      margin-bottom:6px; border:1px solid var(--border)44; }
    .hist-date { font-size:11px; color:var(--muted); margin-bottom:6px; }
    .hist-set-row { display:flex; gap:16px; font-size:12px; color:var(--text2); padding:2px 0; }
    .hist-set-num { color:var(--muted); width:20px; }
    .similar-chip { font-size:12px; padding:6px 12px; border-radius:var(--r-chip);
      border:1px solid var(--border); color:var(--text2); cursor:pointer; white-space:nowrap;
      background:var(--card2); transition:all .15s; }
    .similar-chip:hover { border-color:var(--accent); color:var(--accent); }

    /* ── Exercise demo hero ─────────────────────────────────── */
    .demo-hero { background:var(--card2); border-bottom:1px solid var(--border); }
    .demo-anim-row { display:flex; align-items:center; justify-content:center; gap:16px; padding:16px 20px 8px; }
    .demo-anim-label { font-size:10px; color:var(--muted); text-align:center; text-transform:uppercase; letter-spacing:.06em; margin-top:4px; }
    .demo-frames-strip { display:flex; gap:8px; padding:8px 16px 14px; overflow-x:auto; }
    .demo-frame-box { flex-shrink:0; background:var(--card); border:1px solid var(--border)66; border-radius:var(--r); padding:8px; text-align:center; }
    .demo-frame-lbl { font-size:10px; color:var(--muted); margin-top:4px; }
    @keyframes bcSync { 0%,100%{opacity:.45} 40%,60%{opacity:1} }
    .bc-sync { animation:bcSync 1.6s ease-in-out infinite; }

    /* ── Muscle sheet (bottom sheet from home diagram) ───────── */
    .muscle-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0); z-index:299; pointer-events:none; transition:background .25s; }
    .muscle-backdrop.open { background:rgba(0,0,0,.55); pointer-events:all; }
    .muscle-sheet { position:fixed; bottom:-100%; left:0; right:0; background:var(--card);
      border-radius:20px 20px 0 0; padding:20px; z-index:300; max-height:68vh; overflow-y:auto;
      transition:bottom .3s cubic-bezier(.4,0,.2,1); }
    .muscle-sheet.open { bottom:0; }
    .muscle-sheet-handle { width:36px; height:4px; border-radius:2px; background:var(--border); margin:0 auto 16px; }
    .muscle-sheet-ex { display:flex; align-items:center; gap:12px; padding:10px 0;
      border-bottom:1px solid var(--border)44; cursor:pointer; }
    .muscle-sheet-ex:last-child { border-bottom:none; }
    .muscle-sheet-ex:active { opacity:.7; }
    .m-path-tap { cursor:pointer; }
    .m-path-tap:hover { opacity:.8; }
  </style>
</head>
<body>
  <div id="app" role="main">

    <!-- ── SCREENS ──────────────────────────────────────────── -->
    <div id="screen-home"      class="screen active" role="region" aria-label="Home"></div>
    <div id="screen-schedule"  class="screen"        role="region" aria-label="Schedule"></div>
    <div id="screen-exercises" class="screen"        role="region" aria-label="Exercises"></div>
    <div id="screen-progress"  class="screen"        role="region" aria-label="Progress"></div>
    <div id="screen-profile"   class="screen"        role="region" aria-label="Profile"></div>

    <!-- ── OVERLAYS ─────────────────────────────────────────── -->
    <div id="overlay-detail"  class="overlay" role="dialog" aria-modal="true" aria-label="Exercise detail"></div>
    <div id="overlay-workout" class="overlay" role="dialog" aria-modal="true" aria-label="Active workout"></div>

    <!-- ── MUSCLE BOTTOM SHEET ───────────────────────────────── -->
    <div id="muscle-backdrop" class="muscle-backdrop" onclick="closeMuscleSheet()"></div>
    <div id="muscle-sheet" class="muscle-sheet" role="dialog" aria-modal="true" aria-label="Muscle exercises"></div>

    <!-- ── WEIGHT LOG MODAL ─────────────────────────────────── -->
    <div id="weight-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-label="Log weight">
      <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="t-h1 mb-4">Log Weight</div>
        <div class="flex gap-3 mb-4">
          <div class="num-input-wrap">
            <input type="number" id="weight-val" class="num-input" placeholder="75.0" step="0.1" min="30" max="300" inputmode="decimal">
            <span class="t-xs t-muted">kilograms</span>
          </div>
        </div>
        <button class="btn btn-primary btn-full" onclick="saveWeight()">Save Weight</button>
        <button class="btn btn-ghost btn-full mt-3" onclick="closeWeightModal()">Cancel</button>
      </div>
    </div>

    <!-- ── MUSCLE FILTER SHEET ─────────────────────────────── -->
    <div id="filter-sheet" class="filter-sheet" role="dialog" aria-modal="true" aria-label="Filter by muscle">
      <div class="filter-sheet-overlay" onclick="closeFilterSheet()"></div>
      <div class="filter-sheet-body">
        <div class="flt-handle"></div>
        <div class="flt-hdr">
          <div class="t-h3">Filter by Muscle</div>
          <button class="btn btn-ghost btn-sm" onclick="clearFilters()">Clear All</button>
        </div>
        <div id="flt-chips" class="flt-grid"></div>
        <button class="btn btn-primary btn-full" onclick="closeFilterSheet()">Done</button>
      </div>
    </div>

    <!-- ── WORKOUT SUMMARY ─────────────────────────────────── -->
    <div id="workout-summary" class="wk-summary" role="dialog" aria-modal="true" aria-label="Workout complete">
      <div class="wk-sum-sheet">
        <div class="wk-sum-handle"></div>
        <div id="summary-content"></div>
      </div>
    </div>

    <!-- ── REST TIMER ────────────────────────────────────────── -->
    <div id="rest-overlay" role="dialog" aria-modal="true" aria-label="Rest timer">
      <div style="position:relative;width:160px;height:160px">
        <svg viewBox="0 0 160 160" style="width:160px;height:160px">
          <circle cx="80" cy="80" r="68" stroke="var(--border2)" stroke-width="8" fill="none"/>
          <circle id="rest-ring" cx="80" cy="80" r="68" stroke="var(--accent)" stroke-width="8" fill="none"
            stroke-linecap="round" stroke-dasharray="427" stroke-dashoffset="0"
            transform="rotate(-90 80 80)" style="transition:stroke-dashoffset 1s linear"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px">
          <div id="rest-count" style="font-size:44px;font-weight:700;letter-spacing:-.04em;color:var(--accent)">90</div>
          <div class="t-label t-muted">Rest</div>
        </div>
      </div>
      <div class="t-h2" style="color:var(--text2)">Recovery Time</div>
      <div class="t-sm t-muted" style="text-align:center;max-width:230px;line-height:1.6">
        Rest between sets. Breathe, hydrate, prepare.
      </div>
      <div class="flex gap-3">
        <button class="btn btn-ghost btn-sm" onclick="skipRest()">Skip</button>
        <button class="btn btn-secondary btn-sm" onclick="addRest(30)">+30s</button>
      </div>
    </div>

    <!-- ── BOTTOM NAVIGATION ─────────────────────────────────── -->
    <nav id="bottom-nav" role="navigation" aria-label="Main navigation">

      <button class="nav-item active" onclick="Nav.go('home')" data-tab="home" aria-label="Home" aria-current="page">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Home</span>
      </button>

      <button class="nav-item" onclick="Nav.go('schedule')" data-tab="schedule" aria-label="Schedule">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
          <line x1="8" y1="14" x2="8" y2="14" stroke-width="3"/>
          <line x1="12" y1="14" x2="12" y2="14" stroke-width="3"/>
          <line x1="16" y1="14" x2="16" y2="14" stroke-width="3"/>
        </svg>
        <span>Schedule</span>
      </button>

      <button class="nav-item" onclick="Nav.go('exercises')" data-tab="exercises" aria-label="Exercises">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6.5 6.5h11M6 12h12M6.5 17.5h11"/>
          <circle cx="3.5" cy="6.5" r="1.5" fill="currentColor" stroke="none"/>
          <circle cx="3.5" cy="12"  r="1.5" fill="currentColor" stroke="none"/>
          <circle cx="3.5" cy="17.5" r="1.5" fill="currentColor" stroke="none"/>
          <circle cx="20.5" cy="6.5" r="1.5" fill="currentColor" stroke="none"/>
          <circle cx="20.5" cy="12"  r="1.5" fill="currentColor" stroke="none"/>
          <circle cx="20.5" cy="17.5" r="1.5" fill="currentColor" stroke="none"/>
        </svg>
        <span>Exercises</span>
      </button>

      <button class="nav-item" onclick="Nav.go('progress')" data-tab="progress" aria-label="Progress">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        <span>Progress</span>
      </button>

      <button class="nav-item" onclick="Nav.go('profile')" data-tab="profile" aria-label="Profile">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>Profile</span>
      </button>

    </nav>
  </div><!-- /#app -->

  <script>
    'use strict';

    /* ── SERVICE WORKER REGISTRATION ─────────────────────── */
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    /* ── NAVIGATION MODULE ───────────────────────────────── */
    const Nav = {
      current: 'home',
      rendered: {},

      go(screen) {
        if (Nav.current === screen) return;
        document.getElementById(`screen-${Nav.current}`).classList.remove('active');
        document.getElementById(`screen-${screen}`).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(el => {
          const isActive = el.dataset.tab === screen;
          el.classList.toggle('active', isActive);
          el.setAttribute('aria-current', isActive ? 'page' : 'false');
        });
        Nav.current = screen;
        if (!Nav.rendered[screen]) {
          Nav.rendered[screen] = true;
          Render[screen]();
        }
      }
    };

    /* ═══════════════════════════════════════════════════════
       PHASE 2 — EXERCISE DATABASE
    ═══════════════════════════════════════════════════════ */
    const DB = {
      exercises: {
        'bench-press': {
          id:'bench-press', name:'Barbell Bench Press',
          muscle:'chest', secondary:['shoulders','triceps'],
          equipment:'Barbell, Bench', difficulty:2, pattern:'Horizontal Push',
          sets:4, reps:'8–10', rest:90, cat:'compound', dur:22,
          days:['push','full-body'],
          instructions:['Lie flat, eyes directly under the bar','Grip slightly wider than shoulder-width, wrists straight','Unrack and lower bar to mid-chest over ~2 seconds','Drive bar explosively back to full lockout','Maintain retracted shoulder blades throughout'],
          tips:['Create a lower-back arch to shorten the ROM and protect shoulders','Drive feet hard into the floor for full-body tension','"Bend the bar" inward to activate the chest more'],
          mistakes:['Flaring elbows past 90° — increases shoulder impingement risk','Bouncing bar off chest — removes tension and risks injury','Losing upper-back tightness — causes the bar to drift forward']
        },
        'incline-db-press': {
          id:'incline-db-press', name:'Incline Dumbbell Press',
          muscle:'chest', secondary:['shoulders','triceps'],
          equipment:'Dumbbells, Incline Bench', difficulty:2, pattern:'Incline Push',

    ═══════════════════════════════════════════════════════ */
    const S = {
      _g(k, d = null) {
        try { const v = localStorage.getItem(k); return v !== null ? JSON.parse(v) : d; } catch { return d; }
      },
      _s(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} },

      /* Weight logs ────────────────────────── */
      get weights()   { return this._g('fc_weights', []); },
      addWeight(w) {
        const ws = this.weights;
        const today = Utils.today();
        const idx = ws.findIndex(x => x.date === today);
        if (idx >= 0) ws[idx].w = +w; else ws.push({ date: today, w: +w });
        this._s('fc_weights', ws);
      },

      /* Workout history ───────────────────── */
      get history()   { return this._g('fc_history', []); },
      addWorkout(obj) { const h = this.history; h.push(obj); this._s('fc_history', h); },

      /* Favourites ────────────────────────── */
      get favs()      { return new Set(this._g('fc_favs', [])); },
      toggleFav(id)   {
        const f = this.favs;
        f.has(id) ? f.delete(id) : f.add(id);
        this._s('fc_favs', [...f]);

      /* Settings ──────────────────────────── */
      get settings()  {
        return this._g('fc_settings', {
          startWeight:    105,
          targetWeight:   90,
          height:         178,
          age:            28,
          calorieTarget:  2000,

      /* Personal records ──────────────────── */
      get prs()       { return this._g('fc_prs', {}); },
      get prLog()     { return this._g('fc_prlog', {}); },
      updatePR(id, w, r) {
        const p = this.prs;
        const isNew = !p[id] || +w > p[id].w;
        if (isNew) {
          p[id] = { w: +w, r: +r, date: Utils.today() };
          this._s('fc_prs', p);
          const log = this.prLog;
          if (!log[id]) log[id] = [];
          log[id].push({ date: Utils.today(), w: +w, r: +r });
          this._s('fc_prlog', log);
        }
        return isNew;
      },

      /* Achievements ──────────────────────── */
      get achievements() { return this._g('fc_ach', {}); },
      unlock(id) {
        const a = this.achievements;
        if (!a[id]) { a[id] = Utils.today(); this._s('fc_ach', a); return true; }
        return false;
      },

      /* Recently viewed ───────────────────── */
      get recent()    { return this._g('fc_recent', []); },
      addRecent(id)   {
        const r = this.recent.filter(x => x !== id);
        r.unshift(id);
        this._s('fc_recent', r.slice(0, 12));
      },

      getNote(id)     { return this._g('fc_note_' + id, ''); },

      /* Body measurements ─────────────────── */
      get measurements() { return this._g('fc_measurements', []); },
      addMeasurement(obj) {
        const ms = this.measurements;
        const today = Utils.today();
        const idx = ms.findIndex(m => m.date === today);
        if (idx >= 0) Object.assign(ms[idx], obj, { date: today });
        else ms.push({ date: today, ...obj });
        this._s('fc_measurements', ms);

      getLatestMeasurement() {
        const ms = this.measurements; return ms.length ? ms[ms.length - 1] : {};

    /* ═══════════════════════════════════════════════════════
       PHASE 3 — UTILITIES MODULE
    ═══════════════════════════════════════════════════════ */
    const Utils = {

      today() { return new Date().toISOString().split('T')[0]; },

      formatDate(d) {
        return new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'short' });
      },

      dayName(d)  { return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]; },
      fullDay(d)  { return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d]; },
      monthAbbr(m){ return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m]; },

      greeting() {
        const h = new Date().getHours();
        return h < 5 ? 'Still up?' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
      },

      /* Streak: consecutive days with a logged workout ending today or yesterday */
      getStreak() {
        const hist = S.history;
        if (!hist.length) return 0;
        const done = new Set(hist.map(w => w.date));
        const localDate = d => {
          const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
          return `${y}-${m}-${dd}`;
        };
        let streak = 0;
        const d = new Date(); d.setHours(0,0,0,0);
        for (let i = 0; i < 365; i++) {
          const ds = localDate(d);
          if (done.has(ds)) { streak++; }
          else if (i > 0)   { break; }
          d.setDate(d.getDate() - 1);
        }
        return streak;
      },

      getCurrWeight() {
        const ws = S.weights;
        return ws.length ? ws[ws.length - 1].w : S.settings.startWeight;
      },

      getWeightProgress() {
        const cfg = S.settings;
        const cw  = this.getCurrWeight();
        const total = cfg.startWeight - cfg.targetWeight;
        if (total <= 0) return 100;
        return Math.max(0, Math.min(100, ((cfg.startWeight - cw) / total) * 100));
      },

      getTodayPlan() {
        const dow  = new Date().getDay();
        const type = SCHEDULE[dow];
        return { type, plan: PLANS[type] || null };
      },

      isTodayDone() { return S.history.some(w => w.date === this.today()); },

      /* Mon–Sun array for the current week */
      getWeekDots() {
        const now      = new Date();
        const todayDow = now.getDay();
        const done     = new Set(S.history.map(w => w.date));
        /* offset so index 0 = Monday */
        const monDiff  = (todayDow === 0 ? -6 : 1 - todayDow);
        const monday   = new Date(now); monday.setDate(now.getDate() + monDiff); monday.setHours(0,0,0,0);
        return Array.from({ length: 7 }, (_, i) => {
          const d   = new Date(monday); d.setDate(monday.getDate() + i);
          const ds  = d.toISOString().split('T')[0];
          const dow = d.getDay();
          return { dow, date: ds, done: done.has(ds), type: SCHEDULE[dow], isToday: ds === this.today() };
        });
      },

      muscleColor(m) {
        const map = { chest:'var(--chest)', back:'var(--back)', shoulders:'var(--shoulders)',
          biceps:'var(--biceps)', triceps:'var(--triceps)', legs:'var(--legs)',
          traps:'var(--shoulders)', glutes:'var(--legs)', 'rear-delts':'var(--shoulders)',
          forearms:'var(--biceps)', calves:'var(--legs)', core:'#06b6d4', 'lower-back':'var(--back)' };
        return map[m] || 'var(--accent)';
      },

      diffLabel(d) { return ['','Beginner','Intermediate','Advanced'][d] || ''; },

      fmtTime(s) {
        const m = Math.floor(s / 60), sec = s % 60;
        return m > 0 ? `${m}:${String(sec).padStart(2,'0')}` : String(s);
      },

      fmtDur(min) { return min >= 60 ? `${Math.floor(min/60)}h ${min%60}m` : `${min} min`; },

      /* ── SVG Generator: Progress ring ─────────────────────── */
      progressRing(pct, size, sw, color) {
        const r  = (size - sw * 2) / 2;
        const c  = +(2 * Math.PI * r).toFixed(2);
        const off= +(c * (1 - Math.max(0, Math.min(100, pct)) / 100)).toFixed(2);
        const cx = size / 2, cy = size / 2;
        return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0" aria-hidden="true">
          <circle cx="${cx}" cy="${cy}" r="${r}" stroke="var(--border2)" stroke-width="${sw}" fill="none"/>
          <circle cx="${cx}" cy="${cy}" r="${r}" stroke="${color}" stroke-width="${sw}" fill="none"
            stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
            transform="rotate(-90 ${cx} ${cy})"/>
        </svg>`;
      },

      /* ── SVG Generator: Weight line chart ─────────────────── */
      weightChart(logs) {
        if (!logs.length) return `<div class="empty-state" style="padding:32px 0">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          <div class="t-h3 mt-3" style="color:var(--muted)">No weight entries yet</div>
          <div class="t-sm t-muted">Tap + on the Home screen to log your weight</div>
        </div>`;
        const pts = logs.slice(-30);
        const cfg = S.settings;
        const vals = pts.map(l => +l.w);
        const allVals = [...vals, cfg.targetWeight];
        const min = Math.floor(Math.min(...allVals) - 0.5);
        const max = Math.ceil(Math.max(...allVals) + 0.5);
        const range = max - min || 1;
        const W = 280, H = 110;
        const pad = { t:10, r:28, b:22, l:30 };
        const cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
        const n = pts.length;
        const px = i  => pad.l + (i / Math.max(n-1,1)) * cw;
        const py = v  => pad.t + ch - ((v - min) / range) * ch;
        const polyline = pts.map((p,i) => `${px(i).toFixed(1)},${py(p.w).toFixed(1)}`).join(' ');
        const area = `M${px(0).toFixed(1)},${py(pts[0].w).toFixed(1)} ` +
          pts.map((p,i) => `L${px(i).toFixed(1)},${py(p.w).toFixed(1)}`).join(' ') +
          ` L${px(n-1).toFixed(1)},${(pad.t+ch)} L${px(0).toFixed(1)},${(pad.t+ch)} Z`;
        const ty = py(cfg.targetWeight);
        const yTicks = [min, Math.round((min+max)/2), max];
        return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;overflow:visible" aria-hidden="true">
          <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--accent)" stop-opacity=".3"/>
            <stop offset="100%" stop-color="var(--accent)" stop-opacity=".02"/>
          </linearGradient></defs>
          ${ty>pad.t&&ty<pad.t+ch?`<line x1="${pad.l}" y1="${ty.toFixed(1)}" x2="${W-pad.r}" y2="${ty.toFixed(1)}"
            stroke="var(--accent2)" stroke-width="1.5" stroke-dasharray="5,3" opacity=".8"/>
          <text x="${W-pad.r+3}" y="${ty.toFixed(1)}" font-size="8" fill="var(--accent2)" dominant-baseline="middle">Goal</text>`:''}
          <path d="${area}" fill="url(#cg)"/>
          <polyline points="${polyline}" stroke="var(--accent)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          ${pts.map((p,i)=>`<circle cx="${px(i).toFixed(1)}" cy="${py(p.w).toFixed(1)}"
            r="${i===n-1?4:2.5}" fill="${i===n-1?'var(--accent)':'var(--card)'}"
            stroke="var(--accent)" stroke-width="${i===n-1?0:1.5}"/>`).join('')}
          ${yTicks.map(v=>`<text x="${pad.l-4}" y="${py(v).toFixed(1)}" font-size="9" fill="var(--muted)"
            text-anchor="end" dominant-baseline="middle">${v}</text>`).join('')}
          ${n>1?`<text x="${pad.l}" y="${H-3}" font-size="9" fill="var(--muted)" text-anchor="start">${pts[0].date.slice(5)}</text>
          <text x="${W-pad.r}" y="${H-3}" font-size="9" fill="var(--muted)" text-anchor="end">${pts[n-1].date.slice(5)}</text>`:''}
        </svg>`;
      },

      /* ── Achievement checker (call after each workout save) ── */
      checkAchievements() {
        const hist   = S.history;
        const streak = this.getStreak();
        const lost   = S.settings.startWeight - this.getCurrWeight();
        const total  = hist.length;
        if (total  >= 1)   S.unlock('first-workout');
        if (streak >= 3)   S.unlock('streak-3');
        if (streak >= 7)   S.unlock('streak-7');
        if (streak >= 21)  S.unlock('streak-21');
        if (streak >= 30)  S.unlock('streak-30');
        if (lost   >= 1)   S.unlock('weight-1');
        if (lost   >= 5)   S.unlock('weight-5');
        if (lost   >= 10)  S.unlock('weight-10');
        if (lost   >= 15)  S.unlock('weight-15');
        if (total  >= 10)  S.unlock('workouts-10');
        if (total  >= 25)  S.unlock('workouts-25');
        if (total  >= 50)  S.unlock('workouts-50');
        if (total  >= 100) S.unlock('workouts-100');
        if (Object.keys(S.prs).length >= 1) S.unlock('pr-first');
        if (hist.some(w => w.type === 'full-body')) S.unlock('full-body');
        /* glute workout: any session that has glute exercises */
        const gluteIds = new Set(['barbell-hip-thrust','cable-kickback','hip-abduction','cable-pull-through','kb-swing']);
        if (hist.some(w => (w.exercises||[]).some(id => gluteIds.has(id)))) S.unlock('glute-day');
        /* core workout */
        const coreIds = new Set(['cable-crunch','cable-woodchop','machine-crunch','pallof-press','landmine-rotation']);
        if (hist.some(w => (w.exercises||[]).some(id => coreIds.has(id)))) S.unlock('core-day');
        /* 3 kettlebell exercises logged */
        const kbIds = new Set(['kb-swing','kb-goblet-squat','kb-press']);
        const kbCount = new Set(hist.flatMap(w => (w.exercises||[]).filter(id => kbIds.has(id)))).size;
        if (kbCount >= 3) S.unlock('kb-master');
        /* 5 different muscle groups trained across history */
        const muscles = new Set(hist.flatMap(w => (w.exercises||[]).map(id => { const ex = DB.exercises.find(e=>e.id===id); return ex ? ex.muscle : null; }).filter(Boolean)));
        if (muscles.size >= 5) S.unlock('variety-5');
      },

    function startRest(seconds) {
      if (State.restInterval) clearInterval(State.restInterval);
      State.restRemaining = seconds;
      State.restTotal     = seconds;
      document.getElementById('rest-overlay').classList.add('open');
      _updateRestUI();
      State.restInterval = setInterval(() => {
        State.restRemaining--;
        _updateRestUI();
        if (State.restRemaining <= 0) {
          clearInterval(State.restInterval);
          State.restInterval = null;
          document.getElementById('rest-overlay').classList.remove('open');
        }
      }, 1000);
    }
    function _updateRestUI() {
      const el   = document.getElementById('rest-count');
      const ring = document.getElementById('rest-ring');
      if (!el || !ring) return;
      el.textContent = Utils.fmtTime(State.restRemaining);
      const pct = State.restTotal > 0 ? State.restRemaining / State.restTotal : 0;
      ring.style.strokeDashoffset = (427 * (1 - pct)).toFixed(2);
    }
    function skipRest() {
      if (State.restInterval) { clearInterval(State.restInterval); State.restInterval = null; }
      document.getElementById('rest-overlay').classList.remove('open');
    }
    function addRest(s) {
      State.restRemaining = Math.min(State.restRemaining + s, 300);
      State.restTotal = Math.max(State.restTotal, State.restRemaining);
      _updateRestUI();
    }

              <option value="muscle"${State.exerciseSort==='muscle'?' selected':''}>Muscle</option>
