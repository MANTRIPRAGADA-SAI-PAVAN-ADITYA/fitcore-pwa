    Render.progress = function() {
      const el = document.getElementById('screen-progress');
      if (!el) return;
      const cfg    = S.settings;
      const cw     = Utils.getCurrWeight();
      const pct    = Utils.getWeightProgress();
      const hist   = S.history;
      const streak = Utils.getStreak();
      const prs    = S.prs;
      const prLog  = S.prLog;
      const achs   = S.achievements;
      const today  = new Date(); today.setHours(0,0,0,0);
      const todayStr = today.toISOString().split('T')[0];

      /* ── KPI strip ─────────────────────────────────── */
      const totalSets = hist.reduce((s,w)=>(s + (w.sets||0)), 0);
      const totalMins = hist.reduce((s,w)=>(s + (w.duration||0)), 0);

      /* ── Weekly weight bar chart (last 6 weeks avg) ─ */
      const weights = S.weights;
      const weekBars = Array.from({length:6}, (_,i) => {
        const wStart = new Date(today); wStart.setDate(today.getDate() - (5-i)*7 - today.getDay());
        const wEnd   = new Date(wStart); wEnd.setDate(wStart.getDate()+6);
        const ws = wStart.toISOString().split('T')[0];
        const we = wEnd.toISOString().split('T')[0];
        const entries = weights.filter(w => w.date >= ws && w.date <= we);
        const avg = entries.length ? (entries.reduce((s,e)=>s+e.w,0)/entries.length) : 0;
        return { avg, label: `W${i+1}`, isCur: i===5 };
      });
      const maxW = Math.max(...weekBars.map(b=>b.avg), cfg.startWeight);
      const minW = Math.min(...weekBars.filter(b=>b.avg>0).map(b=>b.avg), cfg.targetWeight);
      const wbHTML = weekBars.map(b => {
        const h = b.avg > 0 ? Math.round(((b.avg-minW)/(maxW-minW||1))*56 + 6) : 3;
        return `<div class="wbc-col">
          <div class="wbc-bar${b.isCur?' cur':''}" style="height:${h}px" title="${b.avg>0?b.avg.toFixed(1)+' kg':'no data'}"></div>
          <div class="wbc-lbl">${b.label}</div>
        </div>`;
      }).join('');

      /* ── Month calendar ─────────────────────────────── */
      const TYPE_COLORS = { Push:'#ef4444', Pull:'#3b82f6', Legs:'#22c55e', Full:'#a855f7', rest:'#334155' };
      const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
      const daysInMonth = new Date(today.getFullYear(), today.getMonth()+1, 0).getDate();
      const startDow = firstDay.getDay();
      const monthStr = today.toISOString().slice(0,7);
      const doneMap = {};
      hist.filter(w=>w.date.startsWith(monthStr)).forEach(w => { doneMap[w.date] = w.type; });
      const calCells = [];
      for (let i=0; i<startDow; i++) calCells.push(`<div class="cal-cell empty"></div>`);
      for (let d=1; d<=daysInMonth; d++) {
        const ds = `${monthStr}-${String(d).padStart(2,'0')}`;
        const isTod = ds === todayStr;
        const isFut = ds > todayStr;
        const type  = doneMap[ds];
        const col   = type ? (TYPE_COLORS[type]||'#6366f1') : '';
        const label = type ? type[0] : String(d);
        calCells.push(`<div class="cal-cell${type?' done':''}${isTod?' today-cell':''}${isFut?' future':''}"
          style="${col?`background:${col};`:''}${!type?`color:var(--${isFut?'muted':'text2'});`:''}"
          title="${ds}${type?' · '+type:''}">${label}</div>`);
      }

      /* ── Body heat volume map ───────────────────────── */
      const thisMonth = monthStr;
      const monthHist = hist.filter(w=>w.date.startsWith(thisMonth));
      const muscleSets = {};
      monthHist.forEach(w => {
        Object.entries(w.logs||{}).forEach(([eid, sets]) => {
          const ex = DB.exercises.find(e=>e.id===eid);
          if (ex) muscleSets[ex.muscle] = (muscleSets[ex.muscle]||0) + (sets||[]).length;
        });
        (w.exercises||[]).forEach(eid => {
          if (!w.logs) {
            const ex = DB.exercises.find(e=>e.id===eid);
            if (ex) muscleSets[ex.muscle] = (muscleSets[ex.muscle]||0) + 3;
          }
        });
      });
      const maxSets = Math.max(...Object.values(muscleSets), 1);
      const heatMuscle = (m) => {
        const v = muscleSets[m] || 0;
        if (!v) return '#141824';
        const t = v / maxSets;
        const r = Math.round(59 + t * 196);
        const g = Math.round(130 - t * 96);
        const b = Math.round(246 - t * 220);
        return `rgb(${r},${g},${b})`;
      };
      const heatBodySVG = `<svg viewBox="0 0 56 112" xmlns="http://www.w3.org/2000/svg" width="70" height="140">
        <circle cx="28" cy="8" r="6.5" fill="#141824" stroke="#2a3655" stroke-width=".8"/>
        <rect x="24.5" y="14.5" width="7" height="5" rx="2" fill="${heatMuscle('neck')}" stroke="#2a3655" stroke-width=".8"/>
        <ellipse cx="11" cy="23" rx="6" ry="5.5" fill="${heatMuscle('shoulders')}" stroke="#2a3655" stroke-width=".8"/>
        <ellipse cx="45" cy="23" rx="6" ry="5.5" fill="${heatMuscle('shoulders')}" stroke="#2a3655" stroke-width=".8"/>
        <rect x="16" y="19" width="24" height="15" rx="3" fill="${heatMuscle('chest')}" stroke="#2a3655" stroke-width=".8"/>
        <rect x="13" y="20" width="5" height="28" rx="2.5" fill="${heatMuscle('lats')}" stroke="none" opacity=".9"/>
        <rect x="38" y="20" width="5" height="28" rx="2.5" fill="${heatMuscle('lats')}" stroke="none" opacity=".9"/>
        <rect x="5.5" y="21" width="7" height="18" rx="3.5" fill="${heatMuscle('biceps')}" stroke="#2a3655" stroke-width=".8"/>
        <rect x="43.5" y="21" width="7" height="18" rx="3.5" fill="${heatMuscle('triceps')}" stroke="#2a3655" stroke-width=".8"/>
        <rect x="5" y="39" width="6.5" height="14" rx="3" fill="${heatMuscle('forearms')}" stroke="#2a3655" stroke-width=".8"/>
        <rect x="44.5" y="39" width="6.5" height="14" rx="3" fill="${heatMuscle('forearms')}" stroke="#2a3655" stroke-width=".8"/>
        <rect x="17" y="34" width="22" height="16" rx="3" fill="${heatMuscle('core')}" stroke="#2a3655" stroke-width=".8"/>
        <rect x="16" y="50" width="11" height="8" rx="3" fill="${heatMuscle('glutes')}" stroke="#2a3655" stroke-width=".8"/>
        <rect x="29" y="50" width="11" height="8" rx="3" fill="${heatMuscle('glutes')}" stroke="#2a3655" stroke-width=".8"/>
        <rect x="17" y="58" width="11" height="24" rx="4" fill="${heatMuscle('quads')}" stroke="#2a3655" stroke-width=".8"/>
        <rect x="28" y="58" width="11" height="24" rx="4" fill="${heatMuscle('hamstrings')}" stroke="#2a3655" stroke-width=".8"/>
        <rect x="17.5" y="82" width="10" height="22" rx="4" fill="${heatMuscle('calves')}" stroke="#2a3655" stroke-width=".8"/>
        <rect x="28.5" y="82" width="10" height="22" rx="4" fill="${heatMuscle('calves')}" stroke="#2a3655" stroke-width=".8"/>
      </svg>`;
      const sortedMuscles = Object.entries(muscleSets).sort((a,b)=>b[1]-a[1]).slice(0,6);
      const heatLegend = sortedMuscles.length
        ? sortedMuscles.map(([m,v])=>`<div class="heat-leg-item"><div class="heat-leg-dot" style="background:${heatMuscle(m)}"></div><span>${m}</span><span class="t-muted" style="margin-left:auto">${v} sets</span></div>`).join('')
        : `<div class="t-sm t-muted">Complete workouts to see volume heat</div>`;

      /* ── PR sparklines ──────────────────────────────── */
      const mkSpark = (pts, w=80, h=28) => {
        if (!pts||pts.length<2) return `<div style="width:${w}px;height:${h}px"></div>`;
        const xs = pts.map(p=>p.w);
        const mn=Math.min(...xs), mx=Math.max(...xs), rng=mx-mn||1;
        const coords = pts.map((p,i)=>{
          const x=4+(i/(pts.length-1))*(w-8);
          const y=h-4-((p.w-mn)/rng)*(h-8);
          return `${x.toFixed(1)},${y.toFixed(1)}`;
        }).join(' ');
        const [lx,ly] = coords.split(' ').pop().split(',');
        return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
          <polyline points="${coords}" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
          <circle cx="${lx}" cy="${ly}" r="2.5" fill="var(--accent)"/>
        </svg>`;
      };
      const prSparkHTML = Object.entries(prs).length
        ? Object.entries(prs).map(([id, pr]) => {
          const ex = DB.exercises.find(e=>e.id===id);
          if (!ex) return '';
          const history = (prLog[id]||[]).slice(-8);
          const delta = history.length >= 2 ? +(history[history.length-1].w - history[0].w).toFixed(1) : 0;
          return `<div class="pr-spark-row" onclick="openDetail('${id}')">
            <div style="flex-shrink:0">${Utils.bodyCard(ex.muscle, ex.secondary||[], 28)}</div>
            <div class="pr-spark-info">
              <div class="pr-spark-name">${ex.name}</div>
              <div class="pr-spark-meta">${Utils.fmtW(pr.w)} × ${pr.r} reps${delta>0?` · <span style="color:#22c55e">+${Utils.fmtWVal(delta)}${Utils.unitLabel}</span>`:''}</div>
            </div>
            <div style="flex-shrink:0">${mkSpark(history)}</div>
          </div>`;
        }).join('')
        : `<div class="t-sm t-muted" style="padding:12px 0">Log sets to track personal records</div>`;

      /* ── Achievements ───────────────────────────────── */
      const achHTML = ACHIEVEMENTS.map(a => {
        const unlocked = !!achs[a.id];
        return `<div class="ach-card${unlocked?' unlocked':''}" title="${a.desc}${unlocked?' · '+Utils.formatDate(achs[a.id]):''}">
          <div class="ach-icon" style="filter:${unlocked?'none':'grayscale(1) opacity(.4)'}">${a.icon}</div>
          <div class="t-xs ach-name">${a.name}</div>
          ${unlocked?'':'<div class="ach-lock">🔒</div>'}
        </div>`;
      }).join('');

      const monthName = today.toLocaleString('default',{month:'long',year:'numeric'});

      el.innerHTML = `
        <div class="screen-header">
          <div class="t-h2">Progress</div>
          <button class="btn btn-ghost btn-sm" onclick="openWeightModal()">+ Weight</button>
        </div>

        <!-- KPI strip -->
        <div class="kpi-strip">
          <div class="kpi-card">
            <div class="kpi-num">${Utils.fmtWVal(cw)}<span style="font-size:14px;font-weight:500"> ${Utils.unitLabel}</span></div>
            <div class="kpi-label">Current weight</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-num" style="color:var(--accent)">${streak}</div>
            <div class="kpi-label">Day streak</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-num">${hist.length}</div>
            <div class="kpi-label">Workouts done</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-num">${Object.keys(prs).length}</div>
            <div class="kpi-label">PRs set</div>
          </div>
        </div>

        <!-- Weight goal -->
        <div class="weight-progress-card card" style="margin-top:12px">
          <div class="wp-header">
            <div>
              <div class="t-h3">Weight Goal</div>
              <div class="t-sm t-muted">${cfg.startWeight} → ${cfg.targetWeight} kg · ${Math.max(0,cw-cfg.targetWeight).toFixed(1)} kg to go</div>
            </div>
            <div class="wp-ring">${Utils.progressRing(pct, 56, 6, 'var(--accent)')}</div>
          </div>
        </div>

        <!-- Weekly weight bar chart -->
        <div class="card" style="margin-top:12px">
          <div class="t-h3 mb-1">Weight — Last 6 Weeks</div>
          <div class="t-xs t-muted mb-2">Average kg per week</div>
          <div class="wbc-wrap">${wbHTML}</div>
        </div>

        <!-- Month calendar -->
        <div class="card" style="margin-top:12px">
          <div class="t-h3 mb-2">${monthName}</div>
          <div class="cal-hdrs">${['S','M','T','W','T','F','S'].map(d=>`<div class="cal-hdr">${d}</div>`).join('')}</div>
          <div class="month-cal">${calCells.join('')}</div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px">
            ${Object.entries(TYPE_COLORS).map(([t,c])=>`<div style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted)"><div style="width:8px;height:8px;border-radius:2px;background:${c}"></div>${t}</div>`).join('')}
          </div>
        </div>

        <!-- Body heat volume -->
        <div class="card" style="margin-top:12px">
          <div class="t-h3 mb-2">Volume Heat Map <span class="t-xs t-muted" style="font-weight:400">This month</span></div>
          <div class="body-heat-row">
            ${heatBodySVG}
            <div class="heat-legend">${heatLegend}</div>
          </div>
        </div>

        <!-- PR sparklines -->
        <div class="card" style="margin-top:12px">
          <div class="t-h3 mb-2">Personal Records</div>
          <div class="pr-spark-list">${prSparkHTML}</div>
        </div>

        <!-- Achievements -->
        <div class="card" style="margin-top:12px">
          <div class="t-h3 mb-2">Achievements</div>
          <div class="achievement-grid">${achHTML}</div>
        </div>

        <div style="height:var(--nav-h)"></div>
      `;
    };

    /* ─── SCREEN HELPER FUNCTIONS ────────────────────── */
    function selectDay(i) {
      State.scheduleDay = i;
      Render.schedule();
    }
    const _ALL_MUSCLES = ['chest','back','lats','shoulders','rear-delts','traps','neck','biceps','triceps','forearms','core','glutes','quads','hamstrings','calves'];

    function openFilterSheet() {
      const grid = document.getElementById('flt-chips');
      if (!grid) return;
      grid.innerHTML = _ALL_MUSCLES.map(m => {
        const on    = State.exerciseFilters.has(m);
        const label = m.split('-').map(w => w[0].toUpperCase()+w.slice(1)).join(' ');
        const col   = Utils.muscleColor(m);
        return `<button class="flt-chip${on?' on':''}"
          style="${on?'border-color:'+col+';color:'+col+';background:'+col+'22':''}"
          onclick="toggleFilterMuscle('${m}')">${label}</button>`;
      }).join('');
      document.getElementById('filter-sheet').classList.add('open');
    }
    function toggleFilterMuscle(m) {
      if (State.exerciseFilters.has(m)) State.exerciseFilters.delete(m);
      else State.exerciseFilters.add(m);
      Render.exercises();
      openFilterSheet();
    }
    function clearFilters() {
      State.exerciseFilters.clear();
      Render.exercises();
      openFilterSheet();
    }
    function closeFilterSheet() {
      document.getElementById('filter-sheet').classList.remove('open');
    }
    function searchExercises(q) {
      State.exerciseSearch = q;
      Render.exercises();
    }
    function toggleFavsFilter() {
      State.showFavsOnly = !State.showFavsOnly;
      Render.exercises();
    }
    function setSortEx(v) {
      State.exerciseSort = v;
      Render.exercises();
    }
    function toggleFav(id) {
      S.toggleFav(id);
      Render.exercises();
    }

    /* ═══════════════════════════════════════════════════════
       PHASE 4 — EXERCISE DETAIL OVERLAY
    ═══════════════════════════════════════════════════════ */
    function openDetail(id) {
      const ex = DB.exercises.find(e => e.id === id);
      if (!ex) return;
      S.addRecent(id);
      const isNewEx = State.detailId !== id;
      State.detailId = id;
      if (isNewEx) State.detailTab = 'instructions'; /* only reset tab when opening a different exercise */
      const isFav     = S.favs.has(id);
      const pr        = S.prs[id];
      const note      = S.getNote(id);

      const breathCue = BREATHING[ex.pattern] || BREATHING['default'];
      const similarEx = DB.exercises.filter(e => e.id !== id && (e.muscle === ex.muscle || (ex.secondary||[]).includes(e.muscle))).slice(0,4);

      const sparklineSVG = (points, w=90, h=30) => {
        if (!points || points.length < 2) return '';
        const xs = points.map(p=>p.w);
        const mn = Math.min(...xs), mx = Math.max(...xs);
        const rng = mx - mn || 1;
        const pts = points.map((p,i) => {
          const x = 4 + (i / (points.length-1)) * (w-8);
          const y = h - 4 - ((p.w - mn) / rng) * (h-8);
          return `${x},${y}`;
        }).join(' ');
        const last = pts.split(' ').pop().split(',');
        return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
          <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
          <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="var(--accent)"/>
        </svg>`;
      };

      const tabContent = () => {
        const t = State.detailTab;
        if (t === 'instructions') return `
          <div class="detail-section">
            <div class="t-h3 mb-2">How to Perform</div>
            <ol class="detail-list">${ex.instructions.map(s=>`<li class="t-sm">${s}</li>`).join('')}</ol>
          </div>
          <div class="detail-section">
            <div class="t-h3 mb-2">Form Cues</div>
            <ul class="detail-list">${ex.tips.map(s=>`<li class="t-sm">✓ ${s}</li>`).join('')}</ul>
          </div>
          <div class="detail-section">
            <div class="t-h3 mb-2">Common Mistakes</div>
            <ul class="detail-list">${ex.mistakes.map(s=>`<li class="t-sm">✗ ${s}</li>`).join('')}</ul>
          </div>
          <div class="detail-section">
            <div class="t-h3 mb-2">Breathing</div>
            <p class="t-sm" style="color:var(--text2);line-height:1.5">${breathCue}</p>
          </div>
          ${(ex.easier || ex.harder) ? `<div class="detail-section">
            <div class="t-h3 mb-2">Progression</div>
            <div style="display:flex;flex-wrap:wrap;gap:8px">
              ${ex.easier ? `<button class="similar-chip" style="border-color:var(--success);color:var(--success)" onclick="openDetail('${ex.easier}')">← Easier: ${(DB.exercises.find(e=>e.id===ex.easier)||{name:ex.easier}).name}</button>` : ''}
              ${ex.harder ? `<button class="similar-chip" style="border-color:var(--accent2);color:var(--accent2)" onclick="openDetail('${ex.harder}')">Harder: ${(DB.exercises.find(e=>e.id===ex.harder)||{name:ex.harder}).name} →</button>` : ''}
            </div>
          </div>` : ''}
          ${similarEx.length ? `<div class="detail-section">
            <div class="t-h3 mb-2">Similar Exercises</div>
            <div style="display:flex;flex-wrap:wrap;gap:8px">
              ${similarEx.map(e=>`<button class="similar-chip" onclick="closeDetail();openDetail('${e.id}')">${e.name}</button>`).join('')}
            </div>
          </div>` : ''}`;
        if (t === 'stats') {
          const prHistory = (S.prLog[id] || []).slice(-8);
          return `
          <div class="detail-section">
            <div class="detail-stat-row">
              <div class="detail-stat"><div class="t-h3">${ex.sets}</div><div class="t-xs t-muted">Sets</div></div>
              <div class="detail-stat"><div class="t-h3">${ex.reps}</div><div class="t-xs t-muted">Reps</div></div>
              <div class="detail-stat"><div class="t-h3">${ex.rest}s</div><div class="t-xs t-muted">Rest</div></div>
              <div class="detail-stat"><div class="t-h3">${Utils.diffLabel(ex.difficulty)}</div><div class="t-xs t-muted">Difficulty</div></div>
            </div>
            ${pr ? `<div class="pr-banner">
              <div style="display:flex;align-items:center;gap:12px;margin-bottom:${prHistory.length?'8px':'0'}">
                <span style="font-size:24px">🏅</span>
                <div><div class="t-h3">Personal Record</div><div class="t-sm t-muted">${Utils.fmtW(pr.w)} × ${pr.r} reps · ${Utils.formatDate(pr.date)}</div></div>
              </div>
              ${prHistory.length >= 2 ? `<div style="margin-top:8px">
                <div class="t-xs t-muted mb-1">Weight progression</div>
                ${sparklineSVG(prHistory, 220, 36)}
              </div>` : ''}
            </div>` : '<div class="t-sm t-muted" style="padding:12px 0">No PR logged yet — complete a set to set your first record.</div>'}
            <div class="orm-calc">
              <div class="t-h3">1RM Calculator</div>
              <div class="t-xs t-muted" style="margin-top:2px">Enter your working weight + reps to estimate max</div>
              <div class="orm-input-row">
                <input id="orm-w" type="number" class="num-input" placeholder="${Utils.unitLabel}" step="0.5" min="0"${pr ? ` value="${Utils.fmtWVal(pr.w)}"` : ''}>
                <input id="orm-r" type="number" class="num-input" placeholder="reps" min="1" step="1"${pr ? ` value="${pr.r}"` : ''}>
                <button class="btn btn-primary btn-sm" onclick="calc1RM()">Calc</button>
              </div>
              <div id="orm-result">${pr ? (() => { const orm = pr.w*(1+pr.r/30); const pcts = [100,90,85,80,75,70]; return `<div class="t-sm" style="color:var(--accent);font-weight:700;margin-top:8px">Est. 1RM: ${Utils.fmtW(orm)}</div><div class="orm-pct-grid">${pcts.map(p=>`<div class="orm-pct-cell"><div class="t-xs t-muted">${p}%</div><div class="t-sm" style="font-weight:600">${Utils.fmtWVal(orm*p/100)}</div></div>`).join('')}</div>`; })() : ''}</div>
            </div>
            <div class="detail-stat-row mt-3">
              <div class="detail-stat"><div class="t-h3" style="color:${Utils.muscleColor(ex.muscle)}">${ex.muscle}</div><div class="t-xs t-muted">Primary</div></div>
              ${(ex.secondary||[]).map(m=>`<div class="detail-stat"><div class="t-h3" style="color:${Utils.muscleColor(m)}">${m}</div><div class="t-xs t-muted">Secondary</div></div>`).join('')}
            </div>
            <div class="muscle-diagram-wrap mt-3">${Utils.bodyCard(ex.muscle, ex.secondary||[], 80)}</div>
          </div>`;
        }
        if (t === 'history') {
          const hist = S.history.filter(w => w.logs && w.logs[id]).slice(-5).reverse();
          if (!hist.length) return `<div class="detail-section"><p class="t-sm t-muted">No sessions logged for this exercise yet.</p></div>`;
          return `<div class="detail-section pr-spark-list">
            ${hist.map(w => {
              const sets = w.logs[id] || [];
              return `<div class="hist-session">
                <div class="hist-date">${Utils.formatDate(w.date)} · ${w.type||'Workout'}</div>
                ${sets.map((s,i)=>`<div class="hist-set-row"><span class="t-muted">Set ${i+1}</span><span>${Utils.fmtW(s.w)} × ${s.r} reps</span></div>`).join('')}
              </div>`;
            }).join('')}
          </div>`;
        }
        if (t === 'notes') return `
          <div class="detail-section">
            <textarea class="notes-area" id="ex-note-${id}" placeholder="Your notes for this exercise…">${note}</textarea>
            <button class="btn btn-primary btn-sm mt-2" onclick="saveExNote('${id}')">Save Note</button>
          </div>`;
        return '';
      };

      const ov = document.getElementById('overlay-detail');
      ov.innerHTML = `
        <div class="overlay-inner">
          <div class="overlay-header">
            <button class="btn btn-icon btn-ghost" onclick="closeDetail()" aria-label="Close">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <div class="t-h3 flex-1">${ex.name}</div>
            <button class="btn btn-icon btn-ghost${isFav?' fav-active':''}" onclick="toggleDetailFav('${id}')" aria-label="${isFav?'Unfavourite':'Favourite'}">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="${isFav?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </button>
          </div>
          ${(() => {

    /* ═══════════════════════════════════════════════════════
       PHASE 4 — ACTIVE WORKOUT OVERLAY
    ═══════════════════════════════════════════════════════ */
    function openWorkout(type, singleId) {
      let plan, exercises;
      if (singleId) {
        const ex = DB.exercises.find(e => e.id === singleId);
        plan = { name:'Quick Set', exercises:[singleId], warmup:[], cooldown:[], duration:15, calories:80, color:'' };
        exercises = [ex];
        type = 'quick';
      } else {
        plan = PLANS[type];
        if (!plan) return;
        exercises = plan.exercises.map(id => DB.exercises.find(e => e.id === id)).filter(Boolean);
      }

      State.activeWorkout = {
        type,
        plan,
        exList:     exercises,
        currExIdx:  0,
        currSetIdx: 0,
        startTime:  Date.now(),
        date:       Utils.today(),
        loggedSets: {},   /* {exId: [{w,r,idx}]} */
        exerciseIds: exercises.map(e=>e.id),
      };

      _renderActiveWorkout();
      document.getElementById('overlay-workout').classList.add('open');
    }

    function _renderActiveWorkout() {
      const ov  = document.getElementById('overlay-workout');
      const aw  = State.activeWorkout;
      if (!aw || !ov) return;
      const ex   = aw.exList[aw.currExIdx];
      if (!ex) return;
      const logs = aw.loggedSets[ex.id] || [];
      const elapsed = Math.round((Date.now() - aw.startTime) / 60000);

      const pr      = S.prs[ex.id];
      const wuRows  = (pr && pr.w && !logs.length) ? [
        { label:'W1', w:(pr.w*0.4).toFixed(1), r:10, hint:'Warm-up' },
        { label:'W2', w:(pr.w*0.6).toFixed(1), r:6,  hint:'Warm-up' },
        { label:'W3', w:(pr.w*0.8).toFixed(1), r:3,  hint:'Feeler'  },
      ].map(wu=>`<tr class="wu-set-row">
        <td>${wu.label}</td>
        <td>${Utils.fmtWVal(wu.w)}</td>
        <td>${wu.r}</td>
        <td><span class="wu-badge">${wu.hint}</span></td>
      </tr>`).join('') : '';

      const setRows = Array.from({ length: ex.sets }, (_, si) => {
        const log  = logs.find(l => l.idx === si);
        const done = !!log;
        const wDef = pr ? pr.w : '';
        const rDef = pr ? pr.r : ex.reps.split('-')[0];
        return `<tr class="${done?'set-done':''}">
          <td class="t-sm t-muted">${si+1}</td>
          <td><input id="set-w-${si}" type="number" class="num-input" placeholder="${Utils.unitLabel}" min="0" step="0.5"
            value="${done ? Utils.fmtWVal(log.w) : (wDef ? Utils.fmtWVal(wDef) : '')}" ${done?'disabled':''}></td>
          <td><input id="set-r-${si}" type="number" class="num-input" placeholder="reps" min="1" step="1"
            value="${done?log.r:rDef}" ${done?'disabled':''}></td>
          <td>
            ${done
              ? `<span style="color:var(--success);font-size:18px">✓</span>`
              : `<button class="btn btn-primary btn-sm" onclick="logSet(${si})">Done</button>`
            }
          </td>
        </tr>`;
      }).join('');

      const progress = `${aw.currExIdx+1} / ${aw.exList.length}`;
      const navHTML  = `
        ${aw.currExIdx > 0
          ? `<button class="btn btn-ghost btn-sm" onclick="prevExercise()">← Prev</button>` : '<span></span>'}
        <div style="display:flex;flex-direction:column;align-items:center;gap:2px">
          <span class="t-xs t-muted">${progress}</span>
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          ${aw.currExIdx < aw.exList.length - 1
            ? `<button class="btn btn-ghost btn-sm" onclick="skipExercise()" style="color:var(--muted)">Skip</button>
               <button class="btn btn-ghost btn-sm" onclick="nextExercise()">Next →</button>`
            : `<button class="btn btn-success btn-sm" onclick="completeWorkout()">Finish ✓</button>`}
        </div>
      `;

      ov.innerHTML = `
        <div class="overlay-inner">
          <div class="overlay-header">
            <button class="btn btn-icon btn-ghost" onclick="confirmExitWorkout()" aria-label="Exit workout">✕</button>
            <div class="t-h3 flex-1">${aw.plan.name}</div>
            <div class="t-sm t-muted">${elapsed} min</div>
          </div>
          <div class="active-ex-header">
            <div class="detail-hero-body" style="padding:8px 0;">${Utils.bodyCard(ex.muscle, ex.secondary||[], 72)}</div>
            <div class="active-ex-info">
              <div class="t-h2">${ex.name}</div>
              <div class="t-sm t-muted">${ex.sets} sets · ${ex.reps} reps · ${ex.rest}s rest</div>
              <div style="display:flex;align-items:center;gap:8px;margin-top:4px">
                <div class="badge badge-${ex.muscle}">${ex.muscle}</div>
                <button class="btn btn-ghost btn-sm" style="font-size:11px;padding:4px 8px" onclick="openSwapModal('${ex.id}')">⇄ Swap</button>
              </div>
            </div>
          </div>
          <div class="set-table-wrap card">
            <table class="set-table" aria-label="Set tracker">
              <thead><tr>
                <th class="t-xs t-muted">Set</th>
                <th class="t-xs t-muted">${Utils.unitLabel.toUpperCase()}</th>
                <th class="t-xs t-muted">Reps</th>
                <th class="t-xs t-muted">Done</th>
              </tr></thead>
              <tbody>${wuRows}${setRows}</tbody>
            </table>
          </div>
          <div class="rest-hint t-xs t-muted">Rest ${ex.rest}s between sets</div>
          <div class="workout-nav">${navHTML}</div>
          <div class="ex-progress-dots">
            ${aw.exList.map((_,i)=>`<div class="ex-dot${i===aw.currExIdx?' active':i<aw.currExIdx?' done':''}"></div>`).join('')}
          </div>
          <div style="height:32px"></div>
        </div>
      `;
    }

    function logSet(si) {
      const aw = State.activeWorkout;
      const ex = aw.exList[aw.currExIdx];
      const wRaw = parseFloat(document.getElementById('set-w-'+si)?.value) || 0;
      const w  = Utils.fromDisplay(wRaw);
      const r  = parseInt(document.getElementById('set-r-'+si)?.value)   || 0;
      if (!aw.loggedSets[ex.id]) aw.loggedSets[ex.id] = [];
      aw.loggedSets[ex.id] = aw.loggedSets[ex.id].filter(l => l.idx !== si);
      aw.loggedSets[ex.id].push({ idx:si, w, r });
      const isPR = S.updatePR(ex.id, w, r);
      if (isPR) showConfetti();
      _renderActiveWorkout();
      /* Auto-start rest timer */
      const allDone = aw.loggedSets[ex.id].length >= ex.sets;
      if (!allDone) startRest(ex.rest);
    }

    function nextExercise() {
      const aw = State.activeWorkout;
      if (aw.currExIdx < aw.exList.length - 1) {
        aw.currExIdx++;
        _renderActiveWorkout();
        document.getElementById('overlay-workout').scrollTop = 0;
      }
    }

    function prevExercise() {
      const aw = State.activeWorkout;
      if (aw.currExIdx > 0) {
        aw.currExIdx--;
        _renderActiveWorkout();
        document.getElementById('overlay-workout').scrollTop = 0;
      }
    }

    function skipExercise() {
      const aw = State.activeWorkout;
      if (!aw.skipped) aw.skipped = [];
      aw.skipped.push(aw.exList[aw.currExIdx].id);
      if (aw.currExIdx < aw.exList.length - 1) {
        aw.currExIdx++;
        _renderActiveWorkout();
        document.getElementById('overlay-workout').scrollTop = 0;
      } else {
        completeWorkout();
      }
    }

    function completeWorkout() {
      const aw   = State.activeWorkout;
      const dur  = Math.max(1, Math.round((Date.now() - aw.startTime) / 60000));
      S.addWorkout({
        date:      aw.date,
        type:      aw.type,
        plan:      aw.plan.name,
        duration:  dur,
        exercises: aw.exerciseIds,
        sets:      Object.values(aw.loggedSets).flat().length,
        logs:      aw.loggedSets,
      });
      Utils.checkAchievements();
      const awSnap = { plan:aw.plan, loggedSets:{...aw.loggedSets} };
      State.activeWorkout = null;
      document.getElementById('overlay-workout').classList.remove('open');
      _showWorkoutSummary(awSnap, dur);
    }

    function _showWorkoutSummary(aw, dur) {
      const totalSets  = Object.values(aw.loggedSets).flat().length;
      const exDone     = Object.keys(aw.loggedSets).length;
      const totalVol   = Object.values(aw.loggedSets).flat().reduce((s,l)=>s+(l.w*l.r),0);
      const prsHit     = Object.entries(aw.loggedSets).filter(([id, sets]) => {
        const pr = S.prs[id]; return pr && sets.some(s => s.w >= pr.w);
      }).length;

      const musVol = {};
      Object.entries(aw.loggedSets).forEach(([id, sets]) => {
        const ex = DB.exercises.find(e => e.id === id);
        if (ex) musVol[ex.muscle] = (musVol[ex.muscle]||0) + sets.length;
      });

      const musHTML = Object.entries(musVol).sort((a,b)=>b[1]-a[1]).map(([m,c]) =>
        `<div class="wk-mus-row">
          <div style="width:8px;height:8px;border-radius:50%;background:${Utils.muscleColor(m)};flex-shrink:0"></div>
          <div class="t-sm" style="flex:1;text-transform:capitalize">${m}</div>
          <div class="t-xs t-muted">${c} set${c!==1?'s':''}</div>
        </div>`
      ).join('');

      document.getElementById('summary-content').innerHTML = `
        <div class="wk-sum-hero">
          <div style="font-size:56px;line-height:1.1">${totalSets === 0 ? '👟' : '🎉'}</div>
          <div class="t-h1 mt-2">${totalSets === 0 ? 'Workout Started!' : 'Workout Done!'}</div>
          <div class="t-sm t-muted mt-1">${aw.plan.name}</div>
        </div>
        <div class="wk-sum-grid">
          <div class="wk-sum-stat"><div class="t-h2">${dur}</div><div class="t-xs t-muted">Minutes</div></div>
          <div class="wk-sum-stat"><div class="t-h2">${totalSets}</div><div class="t-xs t-muted">Sets Logged</div></div>
          <div class="wk-sum-stat"><div class="t-h2">${exDone}</div><div class="t-xs t-muted">Exercises</div></div>
          <div class="wk-sum-stat"><div class="t-h2">${totalVol > 0 ? (totalVol/1000).toFixed(1)+'k' : prsHit}</div>
            <div class="t-xs t-muted">${totalVol > 0 ? `${Utils.unitLabel} Volume` : 'PRs Hit'}</div></div>
        </div>
        ${musHTML ? `<div class="t-h3 mb-2">Muscles Worked</div><div>${musHTML}</div>` : ''}
        <button class="btn btn-primary btn-full mt-4" onclick="closeSummary()">Done — Back to Home</button>
      `;
      document.getElementById('workout-summary').classList.add('open');
    }

    function closeSummary() {
      document.getElementById('workout-summary').classList.remove('open');
      Nav.go('home');
    }

    function confirmExitWorkout() {
      if (confirm('Exit workout? Progress will be lost.')) {
        State.activeWorkout = null;
        document.getElementById('overlay-workout').classList.remove('open');
      }
    }

    function toggleMyGym() {
      State.showMyGymOnly = !State.showMyGymOnly;
      Render.exercises();
    }

    function updateEquip(tag, checked) {
      const cfg = S.settings;
      if (!cfg.equipment) cfg.equipment = [];
      if (checked) { if (!cfg.equipment.includes(tag)) cfg.equipment.push(tag); }
      else { cfg.equipment = cfg.equipment.filter(e => e !== tag); }
      S.saveSettings(cfg);
    }

    function openSwapModal(currentId) {
      const ex = DB.exercises.find(e => e.id === currentId);
      if (!ex) return;
      const myEquip = S.settings.equipment || [];
      let alts = DB.exercises.filter(e =>
        e.id !== currentId &&
        (e.muscle === ex.muscle || (ex.secondary||[]).includes(e.muscle)) &&
        (myEquip.length === 0 || myEquip.includes(e.equip||'barbell'))
      ).slice(0, 8);
      const modal = document.createElement('div');
      modal.id = 'swap-modal';
      modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:flex-end;justify-content:center';
      modal.innerHTML = `<div style="background:var(--card);border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:480px;max-height:70vh;overflow-y:auto">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
          <div class="t-h3">Swap Exercise</div>
          <button class="btn btn-ghost btn-sm" onclick="closeSwapModal()">✕</button>
        </div>
        <div class="t-xs t-muted mb-2">Same muscle · Your equipment</div>
        ${alts.length ? alts.map(a => `<button onclick="swapExercise('${currentId}','${a.id}')" style="display:flex;align-items:center;gap:12px;width:100%;padding:12px;background:var(--card2);border-radius:10px;margin-bottom:8px;text-align:left">
          <div>${Utils.bodyCard(a.muscle,a.secondary||[],40)}</div>
          <div>
            <div class="t-sm" style="font-weight:600">${a.name}</div>
            <div class="t-xs t-muted">${a.muscle} · ${a.equipment}</div>
          </div>
        </button>`).join('') : '<div class="t-sm t-muted">No alternatives found for your equipment</div>'}
        <div style="height:12px"></div>
      </div>`;
      modal.addEventListener('click', e => { if (e.target === modal) closeSwapModal(); });
      document.body.appendChild(modal);
    }

    function closeSwapModal() {
      const m = document.getElementById('swap-modal');
      if (m) m.remove();
    }

    function swapExercise(oldId, newId) {
      closeSwapModal();
      const aw = State.activeWorkout;
      if (!aw) return;
      const idx = aw.exList.findIndex(e => e.id === oldId);
      if (idx < 0) return;
      const newEx = DB.exercises.find(e => e.id === newId);
      if (!newEx) return;
      aw.exList[idx] = newEx;
      _renderActiveWorkout();
    }

    function saveMeasurements() {
      const fields = ['waist','chest','hips','neck','lArm','rArm','lThigh','rThigh','lCalf','rCalf'];
      const obj = {};
      fields.forEach(f => {
        const el = document.getElementById('meas-' + f);
        if (el && el.value) obj[f] = parseFloat(el.value);
      });
      if (!Object.keys(obj).length) return;
      S.addMeasurement(obj);
      Render.profile();
      const btn = document.querySelector('#screen-profile .btn-primary');
      if (btn) { btn.textContent = '✓ Saved!'; setTimeout(() => Render.profile(), 1500); }
    }

    function saveSettings() {
      const cfg = S.settings;
      cfg.height        = parseFloat(document.getElementById('cfg-height')?.value) || cfg.height;
      cfg.age           = parseInt(document.getElementById('cfg-age')?.value)       || cfg.age;
      cfg.startWeight   = Utils.fromDisplay(document.getElementById('cfg-start')?.value)  || cfg.startWeight;
      cfg.targetWeight  = Utils.fromDisplay(document.getElementById('cfg-target')?.value) || cfg.targetWeight;
      cfg.calorieTarget = parseInt(document.getElementById('cfg-cal')?.value)       || cfg.calorieTarget;
      cfg.proteinTarget = parseInt(document.getElementById('cfg-prot')?.value)      || cfg.proteinTarget;
      S.saveSettings(cfg);
      Render.profile();
      if (Nav.current === 'home') Render.home();
    }

    function setUnit(u) {
      const cfg = S.settings; cfg.unit = u; S.saveSettings(cfg);
      Render.profile();
      if (Nav.current === 'progress') Render.progress();
    }

    function exportData() {
      const data = {
        exportDate: new Date().toISOString(),
        app: 'FitCore',
        settings: S.settings,
        measurements: S.measurements,
        weightLog: S.weights,
        workouts: S.history,
        prs: S.prs,
        prLog: S.prLog,
        notes: S._g('fc_notes', {}),
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url;
      a.download = `fitcore-backup-${Utils.today()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function showConfetti() {
      const canvas = document.createElement('canvas');
      canvas.style.cssText = 'position:fixed;inset:0;z-index:9999;pointer-events:none;width:100%;height:100%';
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
      document.body.appendChild(canvas);
      const ctx    = canvas.getContext('2d');
      const colors = ['#f59e0b','#22c55e','#6366f1','#ec4899','#a855f7','#06b6d4'];
      const parts  = Array.from({ length: 90 }, () => ({
        x:   Math.random() * canvas.width,
        y:  -10 - Math.random() * 60,
        vx:  (Math.random() - 0.5) * 5,
        vy:  3 + Math.random() * 4,
        g:   0.06,
        col: colors[Math.floor(Math.random() * colors.length)],
        w:   5 + Math.random() * 6,
        h:   3 + Math.random() * 4,
        ang: Math.random() * 360,
        sp:  (Math.random() - 0.5) * 12,
      }));
      let frame = 0;
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        parts.forEach(p => {
          p.x  += p.vx; p.y += p.vy; p.vy += p.g; p.ang += p.sp;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.ang * Math.PI / 180);
          ctx.fillStyle = p.col;
          ctx.globalAlpha = Math.max(0, 1 - frame / 100);
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        });
        frame++;
        if (frame < 120) requestAnimationFrame(draw);
        else canvas.remove();
      }
      draw();
    }

    function calc1RM() {
      const wInp = parseFloat(document.getElementById('orm-w')?.value);
      const r    = parseInt(document.getElementById('orm-r')?.value);
      if (!wInp || !r || r < 1) return;
      const wKg  = Utils.fromDisplay(wInp);
      const orm  = wKg * (1 + r / 30);
      const pcts = [100, 90, 85, 80, 75, 70];
      const grid = pcts.map(p => `<div class="orm-pct-cell">
        <div class="t-xs t-muted">${p}%</div>
        <div class="t-sm" style="font-weight:600">${Utils.fmtWVal(orm * p / 100)}</div>
      </div>`).join('');

      /* Plate calculator — standard 20 kg Olympic barbell */
      const plateKgs = [20, 15, 10, 5, 2.5, 1.25];
      let rem = Math.max(0, (orm - 20) / 2);
      const loaded = [];
      plateKgs.forEach(p => { const n = Math.floor(rem / p); if (n) { loaded.push({p, n}); rem -= n * p; } });
      const platesHTML = loaded.length
        ? loaded.map(({p, n}) => `<span style="background:var(--card);border:1px solid var(--border);border-radius:4px;padding:2px 7px;font-size:12px;font-weight:600">${n}×${Utils.fmtWVal(p)}</span>`).join(' + ')
        : '<span class="t-xs t-muted">Bar only (20 kg)</span>';

      document.getElementById('orm-result').innerHTML = `
        <div class="t-sm" style="color:var(--accent);font-weight:700;margin-top:8px">Est. 1RM: ${Utils.fmtW(orm)}</div>
        <div class="orm-pct-grid">${grid}</div>
        <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)44">
          <div class="t-xs t-muted mb-1">Plates each side (20 kg bar)</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">${platesHTML}</div>
        </div>`;
    }

    /* ═══════════════════════════════════════════════════════
       PHASE 4 — BOOT: initial render
    ═══════════════════════════════════════════════════════ */
    Nav.rendered['home'] = true;
    Render.home(); /* direct call — Nav.current is already 'home' from shell init */

    /* ── Schedule swipe gestures (listeners persist across re-renders) ── */
    (function initScheduleSwipe() {
      const el = document.getElementById('screen-schedule');
      if (!el) return;
      let _sx = 0, _sy = 0;
      el.addEventListener('touchstart', e => {
        _sx = e.touches[0].clientX;
        _sy = e.touches[0].clientY;
      }, { passive:true });
      el.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - _sx;
        const dy = e.changedTouches[0].clientY - _sy;
        if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
          const next = State.scheduleDay + (dx < 0 ? 1 : -1);
          if (next >= 0 && next <= 6) selectDay(next);
        }
      }, { passive:true });
    })();

  </script>
</body>
